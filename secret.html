<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definitely Not Tattoos</title>
  <meta
    name="description"
    content="A hidden radio tuner page with static, chatter, and a coded signal."
  >
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f1a17'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial, sans-serif' font-size='24' font-weight='700' fill='%23fff8f3'%3Ednt%3C/text%3E%3C/svg%3E"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Share+Tech+Mono&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="secret">
  <main class="secret-page">
    <section class="secret-shell">
      <a class="secret-back" href="index.html">Back</a>
      <p class="lead secret-lead">
        Do not mind the voices. They are only here to observe.
      </p>

      <div class="radio-unit">
        <div class="radio-display">
          <p class="meta-label">Current Frequency</p>
          <p class="radio-frequency" data-frequency-readout>88.0</p>
        </div>

        <label class="radio-slider-shell" for="tuner">
          <span class="meta-label">Tuner</span>
          <input
            class="radio-slider"
            id="tuner"
            type="range"
            min="880"
            max="1080"
            value="880"
            step="1"
            data-radio-tuner
          >
          <span class="radio-scale" aria-hidden="true">
            <span>88</span>
            <span>92</span>
            <span>96</span>
            <span>100</span>
            <span>104</span>
            <span>108</span>
          </span>
        </label>
      </div>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
